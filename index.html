<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullpage.js/dist/fullpage.min.css">
</head>

<body>
    <div id="fullpage">

        <div class="section home">
            <div class="home-right">
                <img src="./images/camera1.png" />
            </div>
            <div class="home-left">
                <h1>Best Camera resolution!</h1>
                <h3>Photographer</h3>
                <p>
                    Lorem ipsum dolor sit amet consectetur adipisicing elit. Iste, quaerat quis! Sequi reiciendis
                    praesentium illum ducimus error ad laboriosam harum.
                </p>
                <div class="button">
                    <a href="#" class="btn-1">Get Started</a>
                    <a href="#" class="btn-2">Register</a>
                </div>
            </div>
        </div>
        <div class="section">
            <div class="slide"> Slide 1 </div>
            <div class="slide"> Slide 2 </div>
            <div class="slide"> Slide 3 </div>
            <div class="slide"> Slide 4 </div>
        </div>
        <div class="section">section 3</div>
        <div class="section">section 4</div>
        <div class="section">section 5</div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/fullpage.js/dist/fullpage.min.js"></script>
    <script>
        new fullpage('#fullpage', {
            //options here
            autoScrolling: true,
            scrollHorizontally: true,
            navigation: true,
            navigationTooltips: ['Home', 'Pics', 'Porfolios', 'Photos', 'Contact'],
            showActiveTooltip: true,
        });

    </script>
</body>

</html>
